version: 2

builds:
  - id: brew-changes
    builder: rust
    binary: brew-changes
    # The release workflow builds each target in parallel; this only stages them.
    tool: ./scripts/prebuilt-cargo.sh
    command: build
    targets:
      - aarch64-apple-darwin
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl

archives:
  - id: brew-changes
    formats: [tar.gz]
    files:
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: brew-changes-rs
    repository:
      owner: garthdw
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/garthdw/brew-changes-rs"
    description: "Interactive changelog viewer for outdated Homebrew packages"
    license: "MIT"
    # Both formulae install `brew-changes`, so only one can be linked at a time.
    conflicts:
      - brew-changes
    commit_author:
      name: Garth de Wet
      email: garth@dewet.dev
    install: |
      bin.install "brew-changes"
    test: |
      assert_match version.to_s, shell_output("#{bin}/brew-changes --version")
