[package]
name = "brew-changes"
version = "0.1.0"
edition = "2024"
description = "Interactive changelog viewer for outdated Homebrew packages"
license = "MIT"
publish = false
default-run = "brew-changes"

[lib]
path = "src/brew_changes.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = "0.3.34"
htmd = "0.5.6"
libc = "0.2.190"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
terminal-colorsaurus = "1.0.3"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "process", "sync", "time", "macros"] }
unicode-width = "0.2.2"
url = "2.5.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
wiremock = "0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
